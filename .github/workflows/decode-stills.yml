name: Decode stills
on:
  push:
    paths:
      - "stills/*.b64"
      - ".github/workflows/decode-stills.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs from base64
        run: |
          set -euo pipefail
          for f in stills/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            python3 - << PY
          import pathlib
          p = pathlib.Path("$out")
          data = p.read_bytes()
          assert data[:3] == b"\xff\xd8\xff", f"not a jpeg: {p} {data[:8]!r}"
          print(p, "ok", len(data), "bytes")
          PY
          done
      - name: Commit JPEGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stills/*.jpg
          if git diff --cached --quiet; then
            echo "No JPEG changes"
          else
            git commit -m "Add decoded campaign email stills"
            git push
          fi
